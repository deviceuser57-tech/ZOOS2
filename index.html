    <script>
      (function() {
        try {
          var stored = localStorage.getItem('zoos_dark_mode');
          if (stored === null || JSON.parse(stored) === true) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
